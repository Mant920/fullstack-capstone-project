apiVersion: apps/v1
kind: Deployment
metadata:
  name: giftapp
  labels:
    app: giftapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: giftapp
  template:
    metadata:
      labels:
        app: giftapp
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: icr
      containers:
        - name: giftapp-container
          # Replace with your actual image: us.icr.io/sn-labs-YOUR_USERNAME/giftapp:latest
          image: us.icr.io/YOUR_NAMESPACE/giftapp:latest
          ports:
            - containerPort: 3060
          env:
            - name: MONGO_URL
              value: "mongodb://mongodb-service:27017"
            - name: JWT_SECRET
              value: "giftlink_super_secret_jwt_key_2024"
            - name: PORT
              value: "3060"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: gift-app-service
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 3060
      protocol: TCP
  selector:
    app: giftapp
